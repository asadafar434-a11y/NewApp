name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: orbital, POSTGRES_PASSWORD: orbital, POSTGRES_DB: orbital_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbital" --health-interval 5s --health-retries 5
    env:
      DATABASE_URL: "postgresql://orbital:orbital@localhost:5432/orbital_test"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orbital/shared build
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm --filter @orbital/api exec prisma migrate deploy
      - run: pnpm -r test
      - run: pnpm -r build
